services:
  db:
    image: pgvector/pgvector:pg16
    container_name: codesentinel-db
    environment:
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel
      POSTGRES_DB: codesentinel
    ports:
      - "5432:5432"
    volumes:
      - codesentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codesentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codesentinel_pgdata:
